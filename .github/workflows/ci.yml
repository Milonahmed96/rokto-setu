name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rokto_db_test
          POSTGRES_USER: rokto_user
          POSTGRES_PASSWORD: rokto_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rokto_user -d rokto_db_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://rokto_user:rokto_pass@localhost:5432/rokto_db_test
      REDIS_URL: redis://localhost:6379
      ANTHROPIC_API_KEY: sk-ant-test-key-placeholder
      SECRET_KEY: test-secret-key-for-ci
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install pgvector on test DB
        run: |
          PGPASSWORD=rokto_pass psql -h localhost -U rokto_user -d rokto_db_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run migrations on test DB
        run: |
          PGPASSWORD=rokto_pass psql -h localhost -U rokto_user -d rokto_db_test -f data/migrations/001_initial.sql
          PGPASSWORD=rokto_pass psql -h localhost -U rokto_user -d rokto_db_test -f data/migrations/002_indexes.sql

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Check API imports cleanly
        run: python -c "from api.main import app; print('API imports OK')"